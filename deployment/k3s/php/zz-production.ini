; blog-v2 production（k3s image）。載入順序在 php.ini（php.ini-production）之後。
expose_php = Off
memory_limit = 128M
; 時區由 Laravel config/app.php 決定（UTC）；這裡只避免 PHP 警告
date.timezone = UTC

; opcache：程式碼做進 image、執行期不會變，所以不檢查時間戳
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
