; blog-v2 production（k3s image）。載入順序在 php.ini（php.ini-production）之後。
expose_php = Off
memory_limit = 128M
; PHP 預設時區（Laravel 啟動後會再以 config/app.php 的 APP_TIMEZONE 覆寫，兩者一致為 Asia/Taipei）。
; Asia/Taipei 由 PHP 內建 timezonedb 解析，不依賴 OS tzdata（image 另有裝 tzdata 供 TZ 環境變數使用）
date.timezone = Asia/Taipei

; opcache：程式碼做進 image、執行期不會變，所以不檢查時間戳
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
