# 改寫自 deployment/local-blog/nginx/conf.d/docker.conf。
# 差異：php-fpm 與 nginx 在同一個 Pod（共用 network namespace），fastcgi_pass 改 127.0.0.1:9000；
# listen 8080（非 root 不能綁 80）；/healthz 由 nginx 自己回 200（liveness 用，不經 Laravel）。
# 不在這裡處理 real_ip：REMOTE_ADDR 是 Traefik Pod IP（10.42.x），由 Laravel 的 trustProxies /
# ResolveCloudflareClientIp 判斷 X-Forwarded-For 與 CF-Connecting-IP（R1）。
server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
