services:
  php:
    build:
      context: ./php
    container_name: ${PROJECT_NAME}-php
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    restart: always
    environment:
      TZ: ${APP_TIMEZONE}
    volumes:
      - ${PROJECT_PATH}:/var/www/html
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:stable-alpine
    container_name: ${PROJECT_NAME}-nginx
    restart: always
    ports:
      # 綁定位址預設維持 0.0.0.0（行為不變）；主機 nginx 反代同機時，在 .env 設 NGINX_BIND_ADDR=127.0.0.1 即可不對外直接發布
      - "${NGINX_BIND_ADDR:-0.0.0.0}:${NGINX_HTTP_PORT}:80"
    volumes:
      - ${PROJECT_PATH}:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    restart: always
    environment:
      TZ: ${APP_TIMEZONE}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # 不可用 sh -c 包一層：官方 entrypoint 只有在第一個參數是 redis-server 時
    # 才會 chown /data 並降權成 redis 使用者，用 sh 開頭會讓 redis 以 root 執行。
    # 密碼改由 compose 變數替換帶入（空字串＝不設密碼，行為同舊版）。
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
    name: ${PROJECT_NAME}-redis-data

networks:
  app:
    name: ${PROJECT_NAME}-network
    driver: bridge
