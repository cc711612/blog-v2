# k3s 環境值（不含祕密）。使用方式（正式由 k3s 主機的 deploy-k3s 執行）：
#   helm upgrade --install blog deploy/helm/blog -n blog -f deploy/helm/blog/values-k3s.yaml --set image.tag=<完整 commit SHA>
image:
  php:
    repository: ghcr.io/cc711612/blog-v2-php
  nginx:
    repository: ghcr.io/cc711612/blog-v2-nginx

imagePullSecrets:
  - name: ghcr-pull

secret:
  existingSecret: blog-env

# 與 usongrat prod .env 相同的非祕密值（2026-11-09 讀取）；k3s 專屬差異：LOG_CHANNEL=stderr、LOG_LEVEL=info（2026-11-10，減少 Loki 寫入）、DB_USERNAME=blog、
# DB_HOST/REDIS_HOST 由 template 決定、TZ（原本是 compose 的 APP_TIMEZONE）。
# APP_TIMEZONE：Laravel 應用時區（config/app.php）；TZ 只影響 OS 層。兩者都是 Asia/Taipei。
# BLOG_TZ_SHIFT_CONFIRMED：只在執行 2026_11_09_000000_shift_timestamps_utc_to_taipei 那一次部署時用
#   暫時加進 Secret blog-env（migrate hook 的 envFrom 也讀它），或手動 helm 時 --set-string env.BLOG_TZ_SHIFT_CONFIRMED=1；
#   不要寫進本檔，跑完即移除（見該 migration 的說明）。
env:
  APP_NAME: Roy
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://roy.usongrat.tw
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  APP_FAKER_LOCALE: en_US
  APP_MAINTENANCE_DRIVER: file
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: mysql
  DB_PORT: "3306"
  DB_DATABASE: blog
  DB_USERNAME: blog
  SESSION_DRIVER: redis
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "false"
  SESSION_PATH: /
  SESSION_DOMAIN: "null"
  CACHE_STORE: redis
  QUEUE_CONNECTION: database
  REDIS_CLIENT: phpredis
  REDIS_PORT: "6379"
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  MAIL_MAILER: log
  MAIL_FROM_ADDRESS: hello@example.com
  MAIL_FROM_NAME: Roy
  GOOGLE_TAG: GTM-M3QLQXN
  CLOUDFLARE_PURGE_ENABLED: "true"
  TZ: Asia/Taipei
  APP_TIMEZONE: Asia/Taipei

db:
  host: 10.0.0.66

# usongrat shared-mysql（auto-generated 憑證，CN=MySQL_Server_8.0.46_Auto_Generated_Server_Certificate、無 SAN）。
