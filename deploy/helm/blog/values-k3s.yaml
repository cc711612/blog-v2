ingress:
  enabled: true
  # 正式網域 roy.usongrat.tw（2026-11-09 切換）；k3s-blog.usongrat.tw 保留當 Access 保護的測試入口
  hosts:
    - roy.usongrat.tw
    - k3s-blog.usongrat.tw
  entryPoints:
    - web

networkPolicy:
  enabled: true
  dbCIDR: 10.0.0.66/32
  dbPort: 3306
  ingressFrom:
    traefik:
      namespace: kube-system
      podLabels:
        app.kubernetes.io/name: traefik
    monitoring:
      namespace: monitoring
