{{- if .Values.migrate.enabled }}
# migrate hook 執行時一般 ConfigMap 尚未建立（或仍是舊值），因此另建 hook 專用 ConfigMap。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blog.fullname" . }}-migrate
  labels:
    {{- include "blog.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  {{- include "blog.configData" . | nindent 2 }}
{{- end }}
