{{- if .Values.redis.enabled }}
{{- $r := .Values.redis }}
# 叢集內 Redis：只放 session / cache / rate limit（資料可丟）。單一副本、Recreate（RWO PVC 不能兩個 Pod 同時掛）。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blog.redisName" . }}
  labels:
    {{- include "blog.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "blog.redisSelectorLabels" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
{{- if $r.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "blog.redisName" . }}
  labels:
    {{- include "blog.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $r.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $r.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blog.redisName" . }}
  labels:
    {{- include "blog.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "blog.redisSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blog.redisSelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        fsGroup: {{ $r.runAs.group }}
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ $r.image | quote }}
          imagePullPolicy: {{ $r.pullPolicy }}
          # $(REDIS_PASSWORD) 由 kubelet 展開，不經 shell（官方 entrypoint 不會因 sh 開頭而以 root 執行）
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --appendonly
            - {{ ternary "yes" "no" $r.appendonly | quote }}
            - --save
            - {{ $r.save | quote }}
            - --maxmemory
            - {{ $r.maxmemory | quote }}
            - --maxmemory-policy
            - {{ $r.maxmemoryPolicy | quote }}
            - --dir
            - /data
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blog.secretName" . }}
                  key: REDIS_PASSWORD
          securityContext:
            {{- include "blog.containerSecurityContext" (dict "root" . "user" $r.runAs.user "group" $r.runAs.group) | nindent 12 }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command: ["sh", "-c", 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        {{- if $r.exporter.enabled }}
        - name: redis-exporter
          image: {{ $r.exporter.image | quote }}
          imagePullPolicy: {{ $r.exporter.pullPolicy }}
          securityContext:
            {{- include "blog.containerSecurityContext" (dict "root" . "user" $r.exporter.runAs.user "group" $r.exporter.runAs.group) | nindent 12 }}
          env:
            - name: REDIS_ADDR
              value: redis://127.0.0.1:6379
            - name: REDIS_EXPORTER_WEB_LISTEN_ADDRESS
              value: ":9121"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blog.secretName" . }}
                  key: REDIS_PASSWORD
          ports:
            # Alloy 以 port 名稱 redis-metrics 辨識，不可改名
            - name: redis-metrics
              containerPort: 9121
              protocol: TCP
          resources:
            {{- toYaml $r.exporter.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: data
          {{- if $r.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "blog.redisName" . }}
          {{- else }}
          emptyDir:
            sizeLimit: 256Mi
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
