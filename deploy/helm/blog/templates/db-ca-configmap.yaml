{{- include "blog.dbTLSValidate" . }}
{{- if and .Values.dbTLS.enabled .Values.dbTLS.caCert }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blog.dbCAConfigMapName" (dict "root" . "suffix" "") }}
  labels:
    {{- include "blog.labels" . | nindent 4 }}
data:
  {{ .Values.dbTLS.caKey }}: |
    {{- include "blog.dbCACert" . | nindent 4 }}
{{- if .Values.migrate.enabled }}
---
# migrate hook 執行時一般 ConfigMap 尚未建立（或仍是舊值），因此另建 hook 專用 ConfigMap。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blog.dbCAConfigMapName" (dict "root" . "suffix" "-migrate") }}
  labels:
    {{- include "blog.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  {{ .Values.dbTLS.caKey }}: |
    {{- include "blog.dbCACert" . | nindent 4 }}
{{- end }}
{{- end }}
