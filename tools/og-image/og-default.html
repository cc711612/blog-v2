<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
    font-family: "PingFang TC", "Noto Sans TC", "Heiti TC", sans-serif;
    background:
      radial-gradient(circle at 85% 15%, rgba(249, 115, 22, 0.22), transparent 42%),
      radial-gradient(circle at 10% 95%, rgba(56, 189, 248, 0.14), transparent 45%),
      linear-gradient(135deg, #0b1120 0%, #111827 55%, #0f172a 100%);
    color: #e5e7eb; position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .wrap { position: relative; padding: 84px 96px; height: 100%; box-sizing: border-box;
          display: flex; flex-direction: column; justify-content: space-between; }
  .prompt { font-family: "SF Mono", Menlo, monospace; font-size: 28px; color: #f97316; letter-spacing: 1px; }
  .prompt span { color: #94a3b8; }
  h1 { margin: 22px 0 0; font-size: 92px; font-weight: 800; line-height: 1.1; color: #f8fafc; letter-spacing: 2px; }
  .sub { margin-top: 26px; font-size: 34px; color: #cbd5e1; }
  .tags { display: flex; gap: 14px; flex-wrap: wrap; }
  .tag { font-family: "SF Mono", Menlo, monospace; font-size: 24px; padding: 8px 18px; border-radius: 10px;
         background: rgba(148, 163, 184, 0.12); border: 1px solid rgba(148, 163, 184, 0.25); color: #e2e8f0; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; }
  .url { font-family: "SF Mono", Menlo, monospace; font-size: 26px; color: #94a3b8; }
  .bar { width: 120px; height: 8px; border-radius: 4px; background: #f97316; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div>
      <div class="prompt">$ cat <span>~/notes</span></div>
      <h1>Roy 的技術筆記</h1>
      <div class="sub">Laravel、PHP 與 DevOps 的實戰紀錄與踩坑</div>
    </div>
    <div class="foot">
      <div class="tags">
        <div class="tag">Laravel</div><div class="tag">PHP</div><div class="tag">MySQL</div>
        <div class="tag">Redis</div><div class="tag">Docker</div><div class="tag">DevOps</div>
      </div>
      <div style="text-align:right">
        <div class="bar" style="margin-left:auto;margin-bottom:14px"></div>
        <div class="url">roy.usongrat.tw</div>
      </div>
    </div>
  </div>
</body>
</html>
